<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Cuisine | Gestion interne</title>
  <link rel="stylesheet" href="cuisine.css">
</head>
<body>
  <!-- HEADER -->
  <header class="cuisine-header">
    <div class="header-left">
      <img id="companyLogo" src="" alt="Logo entreprise" class="company-logo">
      <div class="header-info">
        <h1 id="companyName"></h1>
        <p>Espace Cuisine</p>
      </div>
    </div>
  </header>

  <main class="cuisine-main">
    <!-- SECTION 1 : COMMANDES EN TEMPS RÉEL -->
    <section class="orders-section">
      <h2>Commandes en temps réel</h2>
      <div id="ordersContainer" class="orders-grid">
        <!-- Les commandes seront générées ici par JS -->
        <p class="empty-message">Aucune commande pour le moment</p>
      </div>
    </section>

    <!-- SECTION 2 : AJOUTER UN NOUVEAU PLAT -->
    <section class="add-product-section">
      <h2>Publier un nouveau plat</h2>
      <form id="addProductForm" class="add-form">
        <div class="form-group">
          <label>Photo du plat</label>
          <input type="file" id="newProductImage" accept="image/*" required>
          <div class="preview-image" id="imagePreview">Aperçu</div>
        </div>

        <div class="form-group">
          <label>Nom du plat</label>
          <input type="text" id="newProductName" placeholder="Ex: Poulet frit" required>
        </div>

        <div class="form-group">
          <label>Prix (FC)</label>
          <input type="number" id="newProductPrice" placeholder="Ex: 3500" min="0" required>
        </div>

        <button type="submit" class="btn-primary">Publier le plat</button>
      </form>
    </section>

    <!-- SECTION 3 : GESTION DES PRODUITS -->
    <section class="products-section">
      <h2>Gestion des plats</h2>
      <div id="productsContainer" class="products-list">
        <!-- Les produits seront générés ici par JS -->
      </div>
    </section>
  </main>

  <script src="cuisine.js"></script>
</body>
</html>
